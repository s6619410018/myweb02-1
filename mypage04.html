<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- HTML : List Tag (block) -->
    <!-- รายการแบบมีลำดับ -->
     <ol>
        <li>Hello...</li>
        <li>Hi...</li>
        <li>Hey.... 3</li>
        </ol>
    <ol type="A">
        <li>Hello...</li>
        <li>Hi...</li>
        <li>Hey.... 3</li>
        </ol>


    <ol type="i">
        <li>Hello...</li>
        <li>Hi...</li>
        <li>Hey.... 3</li>
        </ol>

    <!-- รายการแบบไม่มีลำดับ --> 
     <ul>
        <li>Hello...</li>
        <li>Hi...</li>
        <li>Hey.... 3</li>
        </ul>

        <ul type="circle">
        <li>Hello...</li>
        <li>Hi...</li>
        <li>Hey.... 3</li>
        </ul>

        <ul type="square">
        <li>Hello...</li>
        <li>Hi...</li>
        <li>Hey.... 3</li>
        </ul>


      <!-- รายการแบบนิยาม คือ มีหัวข้อ -->
       <!-- dl, dt, dd -->
        <dl>
            <dt>SAU</dt>
            <dd>Southeast Asia University</dd>
            <dt>IoT</dt>
            <dd>Internet of Things</dd>
        </dl>

</body>
</html>
