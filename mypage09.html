<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- HTML : Form Tag (block) -->
     <form action="" method="">
        <label for="">ป้อนอะไรก็ได้</label>
        <input type="text" name="" id="" placeholder="ชื่อ-นามสกุล"> 
        <br><br>
        <label for="">ป้อนตัวเลข</label>
        <input type="number" name="" id="" placeholder="อายุ">
        <br><br>
        <label for="">ป้อนรหัสผ่าน</label>
        <input type="password" name="" id="" placeholder="ไม่ต่ำกว่า 6 ตัวอักษร">
        <br><br>
        <label for="">ป้อนอีเมล</label>
        <input type="email" name="" id="" placeholder="อีเมล">
        <br><br>
        <label for="">ป้อนอะไรก็ได้ที่เนื้อหาเยอะ</label>
        <textarea name="" id="" cols="30" rows="5"></textarea>
        <br><br>

        <label for="">เลือกเพศ</label>
        <input type="radio" name="gender" id="" >ชาย
        <input type="radio" name="gender" id="" >หญิง
        <input type="radio" name="gender" id="" >LGBTQ+
        <input type="radio" name="gender" id="" >ไม่ระบุ   
        <br><br>
        <label for="">จังหวัดบ้านเกิด</label>
        <select>เลือกจังหวัด</label>
            <option value="">กรุงเทพมหานคร</option>
            <option value="">นนทบุรี</option>
            <option value="">ปทุมธานี</option>
            <option value="">สมุทรปราการ</option>
            <option value="">สมุทรสาคร</option>
        </select>    
        <br><br>
        <label for="">Major</label>
        <select name="" id="" size="4">
            <option value="">ตลาด</option>
            <option value="">บัญชี</option>
            <option value="">คอมพิวเตอร์</option>
            <option value="">ไฟฟ้า</option>
            <option value="">มีเดีย</option>
        </select>
        <br><br>
        <label for="">อาหารที่ชอบ</label>
        <input type="checkbox" name="" id="">KFC
        <input type="checkbox" name="" id="">Pizza
        <input type="checkbox" name="" id="">Oishi
        <input type="checkbox" name="" id="">McDonald
        <input type="checkbox" name="" id="">MK
        <br><br>
        <label for="">เลือกไฟล์อะไรก็ได้</label>
        <input type="file" name="" id="">
        <br><br>
        <label for="">เลือกไฟล์รูปภาพ</label>
        <input type="file" name="" id="" accept="image/*">
        <br><br>
        <label for="">เลือกไฟล์ PDF, Word, Excel</label>
        <input type="file" name="" id="" accept=".pdf,.doc,.docx,.xls,.xlsx">
        <br><br>
        <label for="">วันเกิด</label>
        <input type="date" name="" id="">
        <Label for="">เวลาเกิด</Labe>
        <input type="time" name="" id="">
        <label for="">วันและเวลาเกิด</label>
        <input type="datetime-local" name="" id="">
        <!-- ตระกูลกดปุ่ม -->
        <br><br>
        <input type="submit" value="ส่งข้อมูล">
        <br><br>
        <input type="reset" value="ล้างข้อมูล">
        <br><br>
        <input type="button" value="ส่งข้อมูล">
    </form>
</body>
</html>
